name: Publish databricks-execute to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from packages/databricks-execute/package.json
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-databricks-execute
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify package version
        working-directory: packages/databricks-execute
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          ACTUAL_VERSION=$(node --print "require('./package.json').version")
          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Expected version $EXPECTED_VERSION, but package.json contains $ACTUAL_VERSION."
            exit 1
          fi

      - name: Install dependencies
        run: node .yarn/releases/yarn-3.2.1.cjs install --immutable

      - name: Test package
        run: node .yarn/releases/yarn-3.2.1.cjs workspace @fermumen/databricks-execute test

      - name: Build package
        run: node .yarn/releases/yarn-3.2.1.cjs workspace @fermumen/databricks-execute build

      - name: Publish package
        run: npm publish --access public
        working-directory: packages/databricks-execute

      - name: Tag published version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: databricks-execute-v${{ inputs.version }}
        run: |
          if EXISTING_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" \
            --jq ".object.sha" 2>/dev/null); then
            if [[ "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG_NAME already points to $EXISTING_SHA, not $GITHUB_SHA."
              exit 1
            fi
            echo "Tag $TAG_NAME already points to $GITHUB_SHA."
            exit 0
          fi

          for ATTEMPT in 1 2 3; do
            if gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG_NAME}" \
              -f sha="$GITHUB_SHA"; then
              echo "Created tag $TAG_NAME at $GITHUB_SHA."
              exit 0
            fi
            echo "Tag creation attempt $ATTEMPT failed."
            sleep 2
          done

          echo "Failed to create tag $TAG_NAME after publishing."
          exit 1
